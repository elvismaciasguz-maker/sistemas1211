<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="robotica.css">
</head>
<body>
    <div class="switch-container">
        <!-- Lado Azul -->
        <div class="joy-con azul"></div>

        <!-- Pantalla Central -->
        <div class="screen">
            <h1 class="logo-switch">Robótica</h1>
            <div class="menu-grid">
                <button class="game-card" onclick="abrir('Parcial 1: Sensores')">P1</button>
                <button class="game-card" onclick="abrir('Parcial 2: Circuitos')">P2</button>
                <button class="game-card" onclick="abrir('Parcial 3: Programación')">P3</button>
                <button class="game-card circle" onclick="abrir('Programa de Estudio')">+</button>
            </div>
            <div class="footer-icons">
                <span>(A) Seleccionar</span>
            </div>
        </div>

        <!-- Lado Rojo -->
        <div class="joy-con rojo"></div>
    </div>

    <!-- Ventana Modal -->
    <div id="overlay" class="overlay" onclick="cerrar()">
        <div class="ventana-switch" onclick="event.stopPropagation()">
            <h2 id="titulo-modal"></h2>
            <div class="divider"></div>
            <p>Contenido técnico de robótica y hardware.</p>
            <button class="btn-ok" onclick="cerrar()">Aceptar</button>
        </div>
    </div>

    <script src="script_robotica.js"></script>
    <script>// Función para abrir la ventana
function abrir(texto) {
    const titulo = document.getElementById('titulo-modal');
    const modal = document.getElementById('overlay');
    
    if (titulo && modal) {
        titulo.innerText = texto;
        modal.style.display = 'flex';
    }
}

// Función para cerrar la ventana
function cerrar() {
    const modal = document.getElementById('overlay');
    if (modal) {
        modal.style.display = 'none';
    }
}</script>
    
</body>
</html>
